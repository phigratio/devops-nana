# Production stack. For local development, add the dev overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: profile-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    stop_grace_period: 30s
    # No published ports: the database is reachable only from the internal
    # network, never from the host or the outside world.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: ${DB_NAME:-user-account}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-app}
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_root_password
      - mongo_app_password
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  app:
    build:
      context: .
      target: runtime
    image: profile-app:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_APP_USERNAME:-app}
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
      MONGO_AUTH_SOURCE: ${DB_NAME:-user-account}
      DB_NAME: ${DB_NAME:-user-account}
    secrets:
      - mongo_app_password
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # The app writes nothing to disk, so lock the filesystem down.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # Admin UI. Off by default; start it with `--profile tools`.
  # Bound to loopback only -- reach it over an SSH tunnel, not the public internet.
  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/mongo_root_password
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-change-me}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    secrets:
      - mongo_root_password
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  # internal: no route off the host, so the database cannot be reached
  # from outside and cannot itself reach the internet.
  backend:
    internal: true
  frontend:

volumes:
  mongo-data:
  mongo-config:

secrets:
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_app_password:
    file: ./secrets/mongo_app_password.txt
